services:
  pano-pipeline:
    build: .
    image: drone-pano-pipeline:latest
    shm_size: '2gb'
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ASANA_PAT=${ASANA_PAT:-}
      - TRACEAIR_SESS_ID=${TRACEAIR_SESS_ID:-}
      - AIRTABLE_COOKIES=${AIRTABLE_COOKIES:-}
    volumes:
      - ./pano:/app/input
      - ./sky:/app/sky_templates
      - ./sky_catalog.json:/app/sky_catalog.json
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    entrypoint: ["python3", "-u", "scripts/run_pipeline.py"]
